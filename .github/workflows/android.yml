name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # publish the APK to the "latest" release (push to main only)
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build web assets (app base path)
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk shopflow-pos.apk

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: shopflow-pos-debug-apk
          path: shopflow-pos.apk

      # Keeps the public download link working:
      # https://github.com/Crispookalia/shopflow-pos/releases/download/latest/shopflow-pos.apk
      - name: Publish APK to "latest" release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: ShopFlow POS — latest APK
          body: |
            Latest debug build of the ShopFlow POS Android app.

            **Install:** download `shopflow-pos.apk`, open it on your Android
            phone, and allow installation from this source when prompted.
            (Debug build — unsigned for the Play Store; fine for direct install.)
          files: shopflow-pos.apk
